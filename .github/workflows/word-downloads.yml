name: Publish Word DOCX Downloads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/word-downloads.yml'
      - 'scripts/publish_word_downloads.py'
      - 'scripts/replace_word_links.py'
      - 'static/downloads/*.rtf'
      - 'static/editable/*.rtf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: word-download-conversion
  cancel-in-progress: false

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOCX and rendering dependencies
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - name: Convert public RTF templates to native Word documents
        run: python scripts/publish_word_downloads.py
      - name: Switch site links to real DOCX download URLs
        run: python scripts/replace_word_links.py
      - name: Verify resulting Word documents and try PDF previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import zipfile
          docs=list(Path("static/downloads").glob("*.docx"))
          assert len(docs)==8, f"Expected eight Word templates, got {len(docs)}"
          for f in docs:
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None, f
              d=Document(f)
              assert d.tables, f"{f} missing native table"
              print("Native Word verified:",f.name,"paragraphs",len(d.paragraphs),"tables",len(d.tables))
          PY
      - name: Render Microsoft Word PDFs (non-blocking until visual QA)
        continue-on-error: true
        run: |
          mkdir -p /tmp/word-template-pdf
          ls -lh static/downloads/*.docx
          libreoffice -env:UserInstallation=file:///tmp/wordqa_profile2 --headless --convert-to pdf --outdir /tmp/word-template-pdf static/downloads/*.docx
          test "$(find /tmp/word-template-pdf -type f -name '*.pdf' | wc -l)" -eq 8
      - name: Commit converted Word documents and updated download links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/downloads static/editable docs README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish 21 native Word DOCX downloads and replace RTF links"
            git push origin HEAD:main
          else
            echo "All Word downloads and links are already current"
          fi
