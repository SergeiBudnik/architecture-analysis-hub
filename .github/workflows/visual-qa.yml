name: Visual QA — Word and PlantUML
on:
  push:
    branches: [main]
    paths:
      - 'static/editable/**'
      - 'diagrams/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-visual-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Render all PlantUML diagrams
        run: |
          curl -fLsS --retry 3 https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -o /tmp/plantuml.jar
          mkdir -p /tmp/uml-output
          for diagram in diagrams/*.puml; do
            echo "Check diagram: $diagram"
            java -jar /tmp/plantuml.jar -stdrpt:1 -tsvg -o /tmp/uml-output "$diagram"
          done
          count=$(find /tmp/uml-output -name '*.svg' | wc -l)
          echo "Rendered $count PlantUML diagrams"
          test "$count" -ge 26
      - name: Install Word-to-PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - name: Render downloadable Word documents
        run: |
          mkdir -p /tmp/docx-pdfs /tmp/docx-previews
          libreoffice -env:UserInstallation=file:///tmp/lo_qa_profile --headless --convert-to pdf --outdir /tmp/docx-pdfs static/editable/*.docx
          count=$(find /tmp/docx-pdfs -name '*.pdf' | wc -l)
          echo "DOCX documents rendered to PDF: $count"
          test "$count" -ge 8
          for file in /tmp/docx-pdfs/*.pdf; do
            pdfinfo "$file" | grep -E '^Pages:'
            name=$(basename "$file" .pdf)
            pdftoppm -scale-to 1100 -png "$file" "/tmp/docx-previews/$name" >/dev/null 2>&1
          done
          count=$(find /tmp/docx-previews -name '*.png' | wc -l)
          echo "Total rendered Word pages: $count"
          test "$count" -ge 16
      - name: Render all editable RTF files
        run: |
          mkdir -p /tmp/rtf-pdfs /tmp/rtf-previews
          libreoffice -env:UserInstallation=file:///tmp/lo_rtf_qa_profile --headless --convert-to pdf --outdir /tmp/rtf-pdfs static/downloads/*.rtf static/editable/*.rtf
          count=$(find /tmp/rtf-pdfs -name '*.pdf' | wc -l)
          echo "RTF documents rendered to PDF: $count"
          test "$count" -ge 20
          for file in /tmp/rtf-pdfs/*.pdf; do
            name=$(basename "$file" .pdf)
            pdfinfo "$file" | grep -E '^Pages:'
            pdftoppm -scale-to 1100 -png "$file" "/tmp/rtf-previews/$name" >/dev/null 2>&1
          done
          rtfpages=$(find /tmp/rtf-previews -name '*.png' | wc -l)
          echo "Total rendered RTF pages: $rtfpages"
          test "$rtfpages" -ge 21
      - name: Upload render previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-rendered-diagrams-and-word-previews
          path: |
            /tmp/uml-output/*.svg
            /tmp/docx-previews/*.png
            /tmp/rtf-previews/*.png
          if-no-files-found: warn
