name: Deploy Docusaurus to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public editable artifacts
        run: python3 scripts/validate_public_artifacts.py
      - name: Audit public links, formats and source manifest
        run: python3 scripts/quality_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Test generated public pages and downloads
        run: python3 scripts/site_smoke.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4